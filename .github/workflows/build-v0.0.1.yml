name: Build v0.0.1

# 触发条件：
# 1. 推送到 main 分支
# 2. 针对 main 的 Pull Request
# 3. 推送 v* 形式的 tag（用于正式发版）
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

# 同一分支并发构建时只保留最新一次
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# 显式授予 Release 写权限（默认 GITHUB_TOKEN 仅有 contents:read）
permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ComposeFoundry/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('ComposeFoundry/**/*.gradle*', 'ComposeFoundry/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ComposeFoundry/gradlew

      - name: Build debug APK
        working-directory: ComposeFoundry
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        working-directory: ComposeFoundry
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v0.0.1
          path: ComposeFoundry/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v0.0.1
          path: ComposeFoundry/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ComposeFoundry/app/build/outputs/apk/debug/*.apk
            ComposeFoundry/app/build/outputs/apk/release/*.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
