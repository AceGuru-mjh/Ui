name: Plugin CI

on:
  push:
    branches: [main, feat/plugin-production]
    paths:
      - "ComposeFoundry/plugins/**"
      - "ComposeFoundry/core/**"
      - "ComposeFoundry/gradle/**"
      - "ComposeFoundry/build.gradle.kts"
      - "ComposeFoundry/settings.gradle.kts"
      - ".github/workflows/plugin-ci.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: ComposeFoundry

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 单元测试（纯 JVM，无 Android 依赖）
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew test --no-daemon
      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/test-results/**/*.xml"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 插件编译验证（Android Library 需要 SDK）
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  compile-plugins:
    name: Compile Plugins
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew

      - name: Compile all plugin modules
        run: |
          ./gradlew --no-daemon \
            :plugins:plugin-compose-dsl:compileDebugKotlin \
            :plugins:plugin-simple-json:compileDebugKotlin \
            :plugins:plugin-version-printer:compileDebugKotlin \
            :core:renderer-api:compileDebugKotlin

      - name: Upload build scan (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-compile-logs
          path: "**/build/**/*.log"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # DEX 打包验证（确保 packagePlugin 任务可运行）
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  package-plugins:
    name: Package Plugins (DEX)
    runs-on: ubuntu-latest
    needs: compile-plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x gradlew

      - name: Run packagePlugin on both renderer plugins
        run: |
          ./gradlew --no-daemon \
            :plugins:plugin-compose-dsl:packagePlugin \
            :plugins:plugin-simple-json:packagePlugin

      - name: Verify DEX output structure
        run: |
          for MODULE in plugin-compose-dsl plugin-simple-json; do
            PACK="plugins/$MODULE/build/foundry-pack"
            echo "--- $MODULE ---"
            ls -la "$PACK/"
            unzip -l "$PACK/classes.jar" | grep classes.dex || {
              echo "ERROR: classes.dex not found in $PACK/classes.jar"
              exit 1
            }
            echo "  classes.dex verified"
            python3 -c "import json; j=json.load(open('$PACK/foundry-pack.json')); \
              assert j['id'], 'missing id'; \
              assert j['entryClass'], 'missing entryClass'; \
              print(f'  manifest OK: {j[\"id\"]} v{j[\"version\"]}')"
          done

      - name: Upload DEX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foundry-plugin-dex
          path: |
            ComposeFoundry/plugins/plugin-compose-dsl/build/foundry-pack/
            ComposeFoundry/plugins/plugin-simple-json/build/foundry-pack/
          retention-days: 7

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 汇总
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [unit-test, compile-plugins, package-plugins]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "unit-test:     ${{ needs.unit-test.result }}"
          echo "compile:       ${{ needs.compile-plugins.result }}"
          echo "package:       ${{ needs.package-plugins.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more jobs failed"
            exit 1
          fi
          echo "::notice::All plugin jobs passed"
