<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex-Agent | Code Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --secondary-color: #666666;
            --glow-color: rgba(255, 255, 255, 1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', 'Courier', monospace;
            overflow: hidden;
            min-height: 100vh;
            cursor: none;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            animation: scan 2s linear infinite;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6), 0 0 40px rgba(255, 255, 255, 0.3);
        }

        @keyframes scan {
            0% { top: -4px; }
            100% { top: 100%; }
        }

        .scanline2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: scan2 3.5s linear infinite;
            animation-delay: 0.5s;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        @keyframes scan2 {
            0% { top: -2px; }
            100% { top: 100%; }
        }

        .scanline3 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: scan3 5s linear infinite;
            animation-delay: 1.5s;
        }

        @keyframes scan3 {
            0% { top: -1px; }
            100% { top: 100%; }
        }

        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 25%, rgba(255,255,255,0.12) 1px, transparent 1px),
                radial-gradient(circle at 85% 75%, rgba(255,255,255,0.12) 1px, transparent 1px),
                radial-gradient(circle at 45% 55%, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 25px 25px;
            animation: noise 0.6s steps(20) infinite;
        }

        @keyframes noise {
            0%, 100% { opacity: 0.5; }
            20% { opacity: 0.3; }
            40% { opacity: 0.6; }
            60% { opacity: 0.4; }
            80% { opacity: 0.55; }
        }

        .title {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: var(--text-color);
            z-index: 20;
            animation: pulse 2s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; letter-spacing: 12px; text-shadow: 0 0 10px rgba(255,255,255,0.8); }
            50% { opacity: 1; letter-spacing: 14px; text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 40px rgba(255,255,255,0.5); }
        }

        .custom-cursor {
            position: fixed;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
            box-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 20px rgba(255,255,255,0.3);
        }

        .custom-cursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-wrapper">
            <canvas id="codeCanvas"></canvas>
        </div>
        <div class="overlay">
            <div class="scanline"></div>
            <div class="scanline2"></div>
            <div class="scanline3"></div>
            <div class="noise"></div>
        </div>
        <div class="title">APEX-AGENT</div>
        <div class="custom-cursor" id="cursor"></div>
    </div>

    <script>
        const canvas = document.getElementById('codeCanvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.getElementById('cursor');

        let width, height;
        const codeChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?/\\`~[]{}<>|';
        const targetText = 'APEX-AGENT';
        let particles = [];
        let matrixRain = [];
        let glowParticles = [];
        let animationPhase = 0;
        let time = 0;
        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
        });

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initParticles();
            initMatrixRain();
            initGlowParticles();
        }

        function initMatrixRain() {
            matrixRain = [];
            const columns = Math.floor(width / 18);
            for (let i = 0; i < columns; i++) {
                matrixRain.push({
                    x: i * 18,
                    y: Math.random() * -height * 1.5,
                    speed: 1.5 + Math.random() * 4,
                    chars: [],
                    brightness: Math.random()
                });
                for (let j = 0; j < 40; j++) {
                    matrixRain[i].chars.push(codeChars[Math.floor(Math.random() * codeChars.length)]);
                }
            }
        }

        function initGlowParticles() {
            glowParticles = [];
            for (let i = 0; i < 60; i++) {
                glowParticles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: 2 + Math.random() * 6,
                    speedX: (Math.random() - 0.5) * 0.8,
                    speedY: (Math.random() - 0.5) * 0.8,
                    alpha: Math.random() * 0.8,
                    pulse: Math.random() * Math.PI * 2
                });
            }
        }

        function initParticles() {
            particles = [];
            const fontSize = Math.min(width / (targetText.length + 1.5), height / 1.6);
            const textWidth = targetText.length * fontSize * 0.65;
            const startX = (width - textWidth) / 2;
            const startY = height / 2;

            for (let i = 0; i < targetText.length; i++) {
                const char = targetText[i];
                const x = startX + i * fontSize * 0.65;
                const y = startY;
                
                particles.push({
                    char: char,
                    x: x,
                    y: y,
                    targetX: x,
                    targetY: y,
                    originalX: x,
                    originalY: y,
                    speed: 0,
                    active: true,
                    opacity: 0,
                    charIndex: i,
                    codeParticles: [],
                    glowPhase: Math.random() * Math.PI * 2
                });

                for (let j = 0; j < 180; j++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 60 + Math.random() * 600;
                    particles[particles.length - 1].codeParticles.push({
                        char: codeChars[Math.floor(Math.random() * codeChars.length)],
                        x: x + Math.cos(angle) * distance,
                        y: y + Math.sin(angle) * distance,
                        startX: x + Math.cos(angle) * distance,
                        startY: y + Math.sin(angle) * distance,
                        targetX: x,
                        targetY: y,
                        speed: 0.012 + Math.random() * 0.03,
                        opacity: 0,
                        active: true,
                        charChangeTime: Math.random()
                    });
                }
            }

            for (let i = 0; i < 500; i++) {
                particles.push({
                    isFloating: true,
                    char: codeChars[Math.floor(Math.random() * codeChars.length)],
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    opacity: Math.random() * 0.7,
                    size: 8 + Math.random() * 14,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function drawGlowParticles() {
            glowParticles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.pulse += 0.05;
                
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                const pulseAlpha = (Math.sin(p.pulse) * 0.4 + 0.6) * p.alpha;
                const size = p.size * (Math.sin(p.pulse * 2) * 0.3 + 0.7);
                
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * 2);
                gradient.addColorStop(0, `rgba(255,255,255,${pulseAlpha})`);
                gradient.addColorStop(0.5, `rgba(255,255,255,${pulseAlpha * 0.3})`);
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawMatrixRain() {
            const fontSize = 16;
            ctx.font = `${fontSize}px Courier New`;
            ctx.textAlign = 'center';

            matrixRain.forEach(col => {
                col.y += col.speed;
                if (col.y > height + 600) {
                    col.y = -600;
                }

                col.chars.forEach((char, j) => {
                    const y = col.y + j * fontSize;
                    if (y > 0 && y < height) {
                        const opacity = 1 - (j / col.chars.length);
                        const flashAlpha = Math.sin(time * 15 + col.x * 0.1 + j * 0.5) * 0.4 + 0.6;
                        
                        if (j === 0) {
                            ctx.shadowBlur = 15;
                            ctx.shadowColor = 'white';
                        }
                        
                        ctx.fillStyle = `rgba(255, 255, 255, ${opacity * flashAlpha * (j === 0 ? 1 : 0.4)})`;
                        ctx.fillText(char, col.x, y);
                        ctx.shadowBlur = 0;
                    }
                });

                if (Math.random() < 0.04) {
                    const idx = Math.floor(Math.random() * col.chars.length);
                    col.chars[idx] = codeChars[Math.floor(Math.random() * codeChars.length)];
                }
            });
        }

        function drawFloatingParticles() {
            particles.forEach(p => {
                if (p.isFloating) {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.phase += 0.03;
                    
                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;

                    const flashAlpha = Math.sin(time * 4 + p.phase) * 0.4 + 0.6;
                    const glowSize = 4 + Math.sin(time * 2 + p.phase) * 2;
                    
                    ctx.shadowBlur = glowSize;
                    ctx.shadowColor = 'white';
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity * flashAlpha})`;
                    ctx.font = `${p.size}px Courier New`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.char, p.x, p.y);
                    ctx.shadowBlur = 0;
                }
            });
        }

        function drawCodeParticles() {
            const fontSize = 14;
            ctx.font = `${fontSize}px Courier New`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            particles.forEach(particle => {
                if (!particle.isFloating && particle.codeParticles) {
                    particle.codeParticles.forEach(cp => {
                        if (cp.active) {
                            cp.charChangeTime += 0.12;
                            if (cp.charChangeTime > 0.3) {
                                cp.char = codeChars[Math.floor(Math.random() * codeChars.length)];
                                cp.charChangeTime = 0;
                            }

                            const flashAlpha = Math.sin(time * 12 + cp.x * 0.008 + cp.y * 0.008) * 0.5 + 0.5;
                            const glowSize = 3 + Math.sin(time * 3 + cp.x * 0.01) * 2;
                            
                            ctx.shadowBlur = glowSize;
                            ctx.shadowColor = 'white';
                            ctx.fillStyle = `rgba(255, 255, 255, ${cp.opacity * flashAlpha})`;
                            ctx.fillText(cp.char, cp.x, cp.y);
                            ctx.shadowBlur = 0;

                            if (animationPhase === 0) {
                                cp.x += (cp.targetX - cp.x) * cp.speed;
                                cp.y += (cp.targetY - cp.y) * cp.speed;
                                cp.opacity = Math.min(cp.opacity + 0.012, 1);
                            }
                        }
                    });
                }
            });
        }

        function drawTargetText() {
            const fontSize = Math.min(width / (targetText.length + 1.5), height / 1.6);
            
            particles.forEach((particle, index) => {
                if (!particle.isFloating && particle.opacity >= 0) {
                    let flashAlpha = 1;
                    if (animationPhase >= 2) {
                        flashAlpha = Math.sin(time * 8 + index * 1.2) * 0.5 + 0.5;
                    }
                    
                    const glowSize = 15 + Math.sin(time * 3 + particle.glowPhase) * 10;
                    const outerGlow = glowSize * 2;
                    
                    ctx.shadowBlur = outerGlow;
                    ctx.shadowColor = 'white';
                    
                    ctx.font = `bold ${fontSize}px Courier New`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.fillStyle = `rgba(255, 255, 255, ${particle.opacity * flashAlpha})`;
                    ctx.fillText(particle.char, particle.originalX, particle.originalY);
                    
                    ctx.shadowBlur = glowSize;
                    ctx.fillStyle = `rgba(255, 255, 255, ${particle.opacity * flashAlpha * 0.8})`;
                    ctx.fillText(particle.char, particle.originalX, particle.originalY);
                    
                    ctx.shadowBlur = 0;

                    if (animationPhase === 1) {
                        particle.opacity = Math.min(particle.opacity + 0.02, 1);
                    }
                }
            });
        }

        function drawBackground() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            const gridSize = 60;
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.04 + Math.sin(time * 0.5) * 0.02})`;
            ctx.lineWidth = 1;

            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            const centerX = width / 2;
            const centerY = height / 2;
            for (let r = 80; r < Math.max(width, height); r += 120) {
                const baseAlpha = 0.06 * (1 - r / Math.max(width, height));
                const animatedAlpha = baseAlpha + Math.sin(time * 0.8 + r * 0.01) * 0.03;
                ctx.strokeStyle = `rgba(255, 255, 255, ${animatedAlpha})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawConnectionLines() {
            if (animationPhase >= 2) {
                ctx.lineWidth = 1.5;
                
                const mainParticles = particles.filter(p => !p.isFloating);
                for (let i = 0; i < mainParticles.length; i++) {
                    for (let j = i + 1; j < mainParticles.length; j++) {
                        const p1 = mainParticles[i];
                        const p2 = mainParticles[j];
                        const dist = Math.sqrt(Math.pow(p1.originalX - p2.originalX, 2) + Math.pow(p1.originalY - p2.originalY, 2));
                        
                        if (dist < 400) {
                            const alpha = (1 - dist / 400) * 0.35 * (Math.sin(time * 2 + i * 0.5) * 0.5 + 0.5);
                            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                            ctx.shadowBlur = 8;
                            ctx.shadowColor = 'white';
                            ctx.beginPath();
                            ctx.moveTo(p1.originalX, p1.originalY);
                            ctx.lineTo(p2.originalX, p2.originalY);
                            ctx.stroke();
                            ctx.shadowBlur = 0;
                        }
                    }
                }
            }
        }

        function animate() {
            time += 0.04;

            drawBackground();
            drawGlowParticles();
            drawMatrixRain();
            drawFloatingParticles();
            drawCodeParticles();
            drawConnectionLines();
            drawTargetText();

            if (animationPhase === 0 && time > 7) {
                animationPhase = 1;
                particles.filter(p => !p.isFloating).forEach(p => p.opacity = 0.05);
            }

            if (animationPhase === 1 && time > 14) {
                animationPhase = 2;
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
