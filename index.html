<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex-Agent | Code Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --secondary-color: #444444;
            --glow-color: rgba(255, 255, 255, 0.8);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', 'Courier', monospace;
            overflow: hidden;
            min-height: 100vh;
            cursor: none;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            animation: scan 2.5s linear infinite;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        @keyframes scan {
            0% { top: -3px; }
            100% { top: 100%; }
        }

        .scanline2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: scan2 4s linear infinite;
            animation-delay: 1s;
        }

        @keyframes scan2 {
            0% { top: -2px; }
            100% { top: 100%; }
        }

        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08) 1px, transparent 1px),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: noise 0.8s steps(15) infinite;
        }

        @keyframes noise {
            0%, 100% { opacity: 0.4; }
            25% { opacity: 0.2; }
            50% { opacity: 0.5; }
            75% { opacity: 0.3; }
        }

        .title {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--secondary-color);
            z-index: 20;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; letter-spacing: 8px; }
            50% { opacity: 0.8; letter-spacing: 10px; }
        }

        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
        }

        .custom-cursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-wrapper">
            <canvas id="codeCanvas"></canvas>
        </div>
        <div class="overlay">
            <div class="scanline"></div>
            <div class="scanline2"></div>
            <div class="noise"></div>
        </div>
        <div class="title">APEX-AGENT</div>
        <div class="custom-cursor" id="cursor"></div>
    </div>

    <script>
        const canvas = document.getElementById('codeCanvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.getElementById('cursor');

        let width, height;
        const codeChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?/\\`~';
        const targetText = 'APEX-AGENT';
        let particles = [];
        let matrixRain = [];
        let animationPhase = 0;
        let time = 0;
        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.left = mouseX + 'px';
            cursor.style.top = mouseY + 'px';
        });

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initParticles();
            initMatrixRain();
        }

        function initMatrixRain() {
            matrixRain = [];
            const columns = Math.floor(width / 20);
            for (let i = 0; i < columns; i++) {
                matrixRain.push({
                    x: i * 20,
                    y: Math.random() * -height,
                    speed: 1 + Math.random() * 3,
                    chars: []
                });
                for (let j = 0; j < 30; j++) {
                    matrixRain[i].chars.push(codeChars[Math.floor(Math.random() * codeChars.length)]);
                }
            }
        }

        function initParticles() {
            particles = [];
            const fontSize = Math.min(width / (targetText.length + 2), height / 1.8);
            const textWidth = targetText.length * fontSize * 0.65;
            const startX = (width - textWidth) / 2;
            const startY = height / 2;

            for (let i = 0; i < targetText.length; i++) {
                const char = targetText[i];
                const x = startX + i * fontSize * 0.65;
                const y = startY;
                
                particles.push({
                    char: char,
                    x: x,
                    y: y,
                    targetX: x,
                    targetY: y,
                    originalX: x,
                    originalY: y,
                    speed: 0,
                    active: true,
                    opacity: 0,
                    charIndex: i,
                    codeParticles: [],
                    glowPhase: Math.random() * Math.PI * 2
                });

                for (let j = 0; j < 100; j++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 50 + Math.random() * 500;
                    particles[particles.length - 1].codeParticles.push({
                        char: codeChars[Math.floor(Math.random() * codeChars.length)],
                        x: x + Math.cos(angle) * distance,
                        y: y + Math.sin(angle) * distance,
                        startX: x + Math.cos(angle) * distance,
                        startY: y + Math.sin(angle) * distance,
                        targetX: x,
                        targetY: y,
                        speed: 0.015 + Math.random() * 0.025,
                        opacity: 0,
                        active: true,
                        charChangeTime: 0
                    });
                }
            }

            for (let i = 0; i < 400; i++) {
                particles.push({
                    isFloating: true,
                    char: codeChars[Math.floor(Math.random() * codeChars.length)],
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.5,
                    size: 10 + Math.random() * 10
                });
            }
        }

        function drawMatrixRain() {
            const fontSize = 14;
            ctx.font = `${fontSize}px Courier New`;
            ctx.textAlign = 'center';

            matrixRain.forEach(col => {
                col.y += col.speed;
                if (col.y > height + 500) {
                    col.y = -500;
                }

                col.chars.forEach((char, j) => {
                    const y = col.y + j * fontSize;
                    if (y > 0 && y < height) {
                        const opacity = 1 - (j / col.chars.length);
                        const flashAlpha = Math.sin(time * 10 + col.x + j) * 0.3 + 0.7;
                        ctx.fillStyle = `rgba(255, 255, 255, ${opacity * flashAlpha * 0.3})`;
                        ctx.fillText(char, col.x, y);
                    }
                });

                if (Math.random() < 0.02) {
                    const idx = Math.floor(Math.random() * col.chars.length);
                    col.chars[idx] = codeChars[Math.floor(Math.random() * codeChars.length)];
                }
            });
        }

        function drawFloatingParticles() {
            particles.forEach(p => {
                if (p.isFloating) {
                    p.x += p.vx;
                    p.y += p.vy;
                    
                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;

                    const flashAlpha = Math.sin(time * 2 + p.x) * 0.3 + 0.7;
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity * flashAlpha})`;
                    ctx.font = `${p.size}px Courier New`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.char, p.x, p.y);
                }
            });
        }

        function drawCodeParticles() {
            const fontSize = 12;
            ctx.font = `${fontSize}px Courier New`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            particles.forEach(particle => {
                if (!particle.isFloating && particle.codeParticles) {
                    particle.codeParticles.forEach(cp => {
                        if (cp.active) {
                            cp.charChangeTime += 0.1;
                            if (cp.charChangeTime > 0.4) {
                                cp.char = codeChars[Math.floor(Math.random() * codeChars.length)];
                                cp.charChangeTime = 0;
                            }

                            const flashAlpha = Math.sin(time * 8 + cp.x * 0.01 + cp.y * 0.01) * 0.4 + 0.6;
                            ctx.fillStyle = `rgba(255, 255, 255, ${cp.opacity * flashAlpha})`;
                            ctx.fillText(cp.char, cp.x, cp.y);

                            if (animationPhase === 0) {
                                cp.x += (cp.targetX - cp.x) * cp.speed;
                                cp.y += (cp.targetY - cp.y) * cp.speed;
                                cp.opacity = Math.min(cp.opacity + 0.015, 0.9);
                            }
                        }
                    });
                }
            });
        }

        function drawTargetText() {
            const fontSize = Math.min(width / (targetText.length + 2), height / 1.8);
            
            particles.forEach((particle, index) => {
                if (!particle.isFloating && particle.opacity >= 0) {
                    let flashAlpha = 1;
                    if (animationPhase >= 2) {
                        flashAlpha = Math.sin(time * 6 + index * 0.8) * 0.4 + 0.6;
                    }
                    
                    const glowSize = 8 + Math.sin(time * 2 + particle.glowPhase) * 5;
                    ctx.shadowBlur = glowSize;
                    ctx.shadowColor = 'white';
                    
                    ctx.font = `bold ${fontSize}px Courier New`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.fillStyle = `rgba(255, 255, 255, ${particle.opacity * flashAlpha})`;
                    ctx.fillText(particle.char, particle.originalX, particle.originalY);
                    
                    ctx.shadowBlur = 0;

                    if (animationPhase === 1) {
                        particle.opacity = Math.min(particle.opacity + 0.025, 1);
                    }
                }
            });
        }

        function drawBackground() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            const gridSize = 50;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;

            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            const centerX = width / 2;
            const centerY = height / 2;
            for (let r = 50; r < Math.max(width, height); r += 100) {
                const alpha = 0.05 * (1 - r / Math.max(width, height));
                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawConnectionLines() {
            if (animationPhase >= 2) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1;
                
                const mainParticles = particles.filter(p => !p.isFloating);
                for (let i = 0; i < mainParticles.length; i++) {
                    for (let j = i + 1; j < mainParticles.length; j++) {
                        const p1 = mainParticles[i];
                        const p2 = mainParticles[j];
                        const dist = Math.sqrt(Math.pow(p1.originalX - p2.originalX, 2) + Math.pow(p1.originalY - p2.originalY, 2));
                        
                        if (dist < 350) {
                            const alpha = (1 - dist / 350) * 0.25 * (Math.sin(time * 1.5 + i) * 0.5 + 0.5);
                            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                            ctx.beginPath();
                            ctx.moveTo(p1.originalX, p1.originalY);
                            ctx.lineTo(p2.originalX, p2.originalY);
                            ctx.stroke();
                        }
                    }
                }
            }
        }

        function animate() {
            time += 0.03;

            drawBackground();
            drawMatrixRain();
            drawFloatingParticles();
            drawCodeParticles();
            drawConnectionLines();
            drawTargetText();

            if (animationPhase === 0 && time > 6) {
                animationPhase = 1;
                particles.filter(p => !p.isFloating).forEach(p => p.opacity = 0.05);
            }

            if (animationPhase === 1 && time > 12) {
                animationPhase = 2;
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>
