<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX-AGENT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            font-family: 'Courier New', monospace; 
            overflow: hidden;
            cursor: none;
        }
        #canvas { display: block; }
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #fff;
        }
        .cursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="cursor" id="cursor"></div>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.getElementById('cursor');
        
        let width, height;
        const targetText = 'APEX-AGENT';
        let particles = [];
        let time = 0;
        let phase = 0;
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initParticles();
        }
        
        function initParticles() {
            particles = [];
            const fontSize = Math.min(width / (targetText.length + 1), height / 2);
            
            // 绘制临时文字获取轮廓
            ctx.font = `bold ${fontSize}px Courier New`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const textWidth = ctx.measureText(targetText).width;
            const startX = width / 2;
            const startY = height / 2;
            
            // 为每个字符创建粒子
            for (let i = 0; i < targetText.length; i++) {
                const char = targetText[i];
                const charWidth = ctx.measureText(char).width;
                const x = startX - textWidth / 2 + (i * charWidth) + charWidth / 2;
                
                // 主文字粒子
                particles.push({
                    type: 'char',
                    char: char,
                    x: x,
                    y: startY,
                    opacity: 0,
                    targetX: x,
                    targetY: startY,
                    pulse: Math.random() * Math.PI * 2
                });
                
                // 代码粒子（减少到每字符30个）
                for (let j = 0; j < 30; j++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 100 + Math.random() * 300;
                    particles.push({
                        type: 'code',
                        char: getRandomChar(),
                        x: x + Math.cos(angle) * distance,
                        y: startY + Math.sin(angle) * distance,
                        targetX: x + (Math.random() - 0.5) * 40,
                        targetY: startY + (Math.random() - 0.5) * 40,
                        opacity: 0,
                        speed: 0.02 + Math.random() * 0.02
                    });
                }
            }
            
            // 背景浮动粒子（减少到100个）
            for (let i = 0; i < 100; i++) {
                particles.push({
                    type: 'float',
                    char: getRandomChar(),
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    opacity: Math.random() * 0.5,
                    size: 10 + Math.random() * 10
                });
            }
        }
        
        function getRandomChar() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
            return chars[Math.floor(Math.random() * chars.length)];
        }
        
        function draw() {
            time += 0.05;
            
            // 清除画布
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            // 网格背景
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // 更新和绘制粒子
            particles.forEach(p => {
                if (p.type === 'float') {
                    // 浮动粒子
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;
                    
                    const flash = Math.sin(time * 3 + p.x * 0.01) * 0.3 + 0.7;
                    ctx.fillStyle = `rgba(255,255,255,${p.opacity * flash})`;
                    ctx.font = `${p.size}px Courier New`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.char, p.x, p.y);
                }
                else if (p.type === 'code') {
                    // 代码粒子
                    if (phase === 0) {
                        p.x += (p.targetX - p.x) * p.speed;
                        p.y += (p.targetY - p.y) * p.speed;
                        p.opacity = Math.min(p.opacity + 0.02, 1);
                    }
                    
                    if (Math.random() < 0.05) p.char = getRandomChar();
                    const flash = Math.sin(time * 5 + p.x * 0.01) * 0.4 + 0.6;
                    
                    ctx.fillStyle = `rgba(255,255,255,${p.opacity * flash})`;
                    ctx.font = '12px Courier New';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.char, p.x, p.y);
                }
                else if (p.type === 'char') {
                    // 主文字
                    if (phase === 1) {
                        p.opacity = Math.min(p.opacity + 0.03, 1);
                    }
                    
                    const fontSize = Math.min(width / (targetText.length + 1), height / 2);
                    const flash = Math.sin(time * 4 + p.pulse) * 0.4 + 0.6;
                    const glow = 10 + Math.sin(time * 2 + p.pulse) * 5;
                    
                    ctx.shadowBlur = glow;
                    ctx.shadowColor = '#fff';
                    ctx.font = `bold ${fontSize}px Courier New`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = `rgba(255,255,255,${p.opacity * flash})`;
                    ctx.fillText(p.char, p.x, p.y);
                    ctx.shadowBlur = 0;
                }
            });
            
            // 连接线
            if (phase >= 2) {
                const chars = particles.filter(p => p.type === 'char');
                for (let i = 0; i < chars.length; i++) {
                    for (let j = i + 1; j < chars.length; j++) {
                        const dist = Math.sqrt(
                            Math.pow(chars[i].x - chars[j].x, 2) +
                            Math.pow(chars[i].y - chars[j].y, 2)
                        );
                        if (dist < 300) {
                            const alpha = (1 - dist / 300) * 0.3 * (Math.sin(time * 2 + i) * 0.5 + 0.5);
                            ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(chars[i].x, chars[i].y);
                            ctx.lineTo(chars[j].x, chars[j].y);
                            ctx.stroke();
                        }
                    }
                }
            }
            
            // 阶段管理
            if (phase === 0 && time > 5) {
                phase = 1;
                particles.filter(p => p.type === 'char').forEach(p => p.opacity = 0.1);
            }
            if (phase === 1 && time > 10) {
                phase = 2;
            }
            
            requestAnimationFrame(draw);
        }
        
        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>
