<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX-AGENT | Premium Code Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 50%, #000000 100%);
            font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
            overflow: hidden;
            cursor: none;
            min-height: 100vh;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.8) 20%, 
                rgba(255, 255, 255, 0.9) 50%, 
                rgba(255, 255, 255, 0.8) 80%, 
                transparent 100%);
            animation: scanMove 3s ease-in-out infinite;
            box-shadow: 
                0 0 10px rgba(255, 255, 255, 0.5),
                0 0 20px rgba(255, 255, 255, 0.3),
                0 0 30px rgba(255, 255, 255, 0.1);
        }

        @keyframes scanMove {
            0%, 100% { top: -2px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            animation: noiseFlicker 0.5s steps(5) infinite;
        }

        @keyframes noiseFlicker {
            0%, 100% { opacity: 0.03; }
            50% { opacity: 0.05; }
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                transparent 50%,
                rgba(0, 0, 0, 0.4) 100%
            );
        }

        .corner-frame {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            pointer-events: none;
        }

        .corner-frame.top-left {
            top: 30px;
            left: 30px;
            border-right: none;
            border-bottom: none;
        }

        .corner-frame.top-right {
            top: 30px;
            right: 30px;
            border-left: none;
            border-bottom: none;
        }

        .corner-frame.bottom-left {
            bottom: 30px;
            left: 30px;
            border-right: none;
            border-top: none;
        }

        .corner-frame.bottom-right {
            bottom: 30px;
            right: 30px;
            border-left: none;
            border-top: none;
        }

        .info-panel {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
        }

        .info-panel .title {
            font-size: 12px;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 8px;
            animation: infoPulse 3s ease-in-out infinite;
        }

        .info-panel .version {
            font-size: 10px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.5);
        }

        @keyframes infoPulse {
            0%, 100% { opacity: 0.6; letter-spacing: 8px; }
            50% { opacity: 1; letter-spacing: 10px; }
        }

        .cursor {
            position: fixed;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease-out, border-color 0.3s ease;
            box-shadow: 
                0 0 15px rgba(255, 255, 255, 0.6),
                0 0 30px rgba(255, 255, 255, 0.3),
                inset 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .cursor::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px white;
        }

        .cursor::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: cursorRing 2s ease-in-out infinite;
        }

        @keyframes cursorRing {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }

        .loading-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            letter-spacing: 4px;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        .loading-indicator.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-bar {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: white;
            animation: loadingSlide 1.5s ease-in-out infinite;
        }

        @keyframes loadingSlide {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        
        <div class="overlay">
            <div class="scan-line"></div>
            <div class="noise"></div>
            <div class="vignette"></div>
            <div class="corner-frame top-left"></div>
            <div class="corner-frame top-right"></div>
            <div class="corner-frame bottom-left"></div>
            <div class="corner-frame bottom-right"></div>
        </div>
        
        <div class="info-panel">
            <div class="title">APEX-AGENT</div>
            <div class="version">v1.0.0 // AI POWERED</div>
        </div>
        
        <div class="loading-indicator" id="loading">
            <div>INITIALIZING</div>
            <div class="loading-bar"></div>
        </div>
        
        <div class="cursor" id="cursor"></div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.getElementById('cursor');
        const loading = document.getElementById('loading');

        let width, height;
        const targetText = 'APEX-AGENT';
        let particles = [];
        let codeParticles = [];
        let backgroundStars = [];
        let gridPoints = [];
        let time = 0;
        let phase = 0;
        let mouseX = 0, mouseY = 0;
        let targetMouseX = 0, targetMouseY = 0;

        document.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initParticles();
            initBackgroundStars();
            initGridPoints();
        }

        function initBackgroundStars() {
            backgroundStars = [];
            for (let i = 0; i < 80; i++) {
                backgroundStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2 + 0.5,
                    opacity: Math.random() * 0.5 + 0.1,
                    pulse: Math.random() * Math.PI * 2,
                    pulseSpeed: 0.02 + Math.random() * 0.03
                });
            }
        }

        function initGridPoints() {
            gridPoints = [];
            const spacing = 60;
            for (let x = spacing; x < width; x += spacing) {
                for (let y = spacing; y < height; y += spacing) {
                    gridPoints.push({
                        x: x,
                        y: y,
                        baseX: x,
                        baseY: y,
                        pulse: Math.random() * Math.PI * 2,
                        intensity: 0
                    });
                }
            }
        }

        function initParticles() {
            particles = [];
            codeParticles = [];
            
            const fontSize = Math.min(width / (targetText.length + 0.8), height / 1.8);
            ctx.font = `bold ${fontSize}px 'SF Mono', 'Fira Code', monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const textWidth = ctx.measureText(targetText).width;
            const startX = width / 2;
            const startY = height / 2;
            
            // 为每个字符创建主粒子
            for (let i = 0; i < targetText.length; i++) {
                const char = targetText[i];
                let charWidth = ctx.measureText(char).width;
                let x = startX - textWidth / 2;
                
                for (let j = 0; j < i; j++) {
                    x += ctx.measureText(targetText[j]).width;
                }
                x += charWidth / 2;
                
                // 主字符粒子
                particles.push({
                    type: 'main',
                    char: char,
                    x: x,
                    y: startY,
                    originalX: x,
                    originalY: startY,
                    opacity: 0,
                    glowIntensity: 0,
                    phase: Math.random() * Math.PI * 2,
                    index: i
                });
                
                // 字符周围的装饰粒子
                for (let k = 0; k < 20; k++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 30 + Math.random() * 60;
                    particles.push({
                        type: 'decoration',
                        char: getRandomChar(),
                        x: x + Math.cos(angle) * radius,
                        y: startY + Math.sin(angle) * radius,
                        targetX: x,
                        targetY: startY,
                        opacity: 0,
                        speed: 0.015 + Math.random() * 0.015,
                        angle: angle,
                        radius: radius
                    });
                }
                
                // 汇聚的代码粒子
                for (let k = 0; k < 50; k++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 150 + Math.random() * 400;
                    codeParticles.push({
                        char: getRandomChar(),
                        x: x + Math.cos(angle) * distance,
                        y: startY + Math.sin(angle) * distance,
                        targetX: x + (Math.random() - 0.5) * 50,
                        targetY: startY + (Math.random() - 0.5) * 50,
                        speed: 0.008 + Math.random() * 0.015,
                        opacity: 0,
                        changeRate: 0.02 + Math.random() * 0.05
                    });
                }
            }
            
            // 背景漂浮代码
            for (let i = 0; i < 150; i++) {
                particles.push({
                    type: 'floating',
                    char: getRandomChar(),
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.6,
                    vy: (Math.random() - 0.5) * 0.6,
                    opacity: Math.random() * 0.6 + 0.2,
                    size: 8 + Math.random() * 12,
                    pulse: Math.random() * Math.PI * 2
                });
            }
        }

        function getRandomChar() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789{}[]<>/\\|;:=+-*&^%$#@!~`';
            return chars[Math.floor(Math.random() * chars.length)];
        }

        function drawBackground() {
            // 渐变背景
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, Math.max(width, height) * 0.7
            );
            gradient.addColorStop(0, '#0a0a0a');
            gradient.addColorStop(0.5, '#050505');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // 动态网格
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.03 + Math.sin(time * 0.5) * 0.02})`;
            ctx.lineWidth = 1;
            
            const gridSpacing = 60;
            for (let x = 0; x < width; x += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSpacing) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            
            // 同心圆
            const centerX = width / 2;
            const centerY = height / 2;
            for (let r = 100; r < Math.max(width, height) * 0.6; r += 150) {
                const alpha = 0.04 * (1 - r / (Math.max(width, height) * 0.6));
                const animatedAlpha = alpha + Math.sin(time * 0.8 + r * 0.01) * 0.02;
                ctx.strokeStyle = `rgba(255, 255, 255, ${animatedAlpha})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawStars() {
            backgroundStars.forEach(star => {
                star.pulse += star.pulseSpeed;
                const pulseAlpha = (Math.sin(star.pulse) * 0.5 + 0.5);
                
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity * pulseAlpha})`;
                ctx.fill();
            });
        }

        function drawFloatingParticles() {
            particles.filter(p => p.type === 'floating').forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.pulse += 0.03;
                
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;
                
                const flash = Math.sin(time * 2 + p.pulse) * 0.3 + 0.7;
                const glow = 3 + Math.sin(time * 1.5 + p.pulse) * 2;
                
                ctx.shadowBlur = glow;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity * flash})`;
                ctx.font = `${p.size}px 'SF Mono', monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.char, p.x, p.y);
                ctx.shadowBlur = 0;
            });
        }

        function drawCodeParticles() {
            const fontSize = 11;
            ctx.font = `${fontSize}px 'SF Mono', monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            codeParticles.forEach(cp => {
                if (phase === 0) {
                    cp.x += (cp.targetX - cp.x) * cp.speed;
                    cp.y += (cp.targetY - cp.y) * cp.speed;
                    cp.opacity = Math.min(cp.opacity + 0.008, 0.9);
                }
                
                if (Math.random() < cp.changeRate) {
                    cp.char = getRandomChar();
                }
                
                const flash = Math.sin(time * 4 + cp.x * 0.008) * 0.4 + 0.6;
                const glow = phase >= 2 ? 2 + Math.sin(time * 3 + cp.x * 0.01) * 1 : 0;
                
                ctx.shadowBlur = glow;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
                ctx.fillStyle = `rgba(255, 255, 255, ${cp.opacity * flash})`;
                ctx.fillText(cp.char, cp.x, cp.y);
                ctx.shadowBlur = 0;
            });
        }

        function drawMainChars() {
            const fontSize = Math.min(width / (targetText.length + 0.8), height / 1.8);
            
            particles.filter(p => p.type === 'main').forEach(p => {
                if (phase >= 1) {
                    p.opacity = Math.min(p.opacity + 0.02, 1);
                }
                
                const flash = phase >= 2 ? (Math.sin(time * 3 + p.index * 0.8) * 0.4 + 0.6) : 1;
                const glowSize = 8 + Math.sin(time * 2 + p.phase) * 4;
                
                // 多层发光效果
                for (let i = 3; i >= 0; i--) {
                    const layerGlow = glowSize * (i + 1) * 0.5;
                    const layerAlpha = (0.15 - i * 0.03) * flash;
                    ctx.shadowBlur = layerGlow;
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                    ctx.fillStyle = `rgba(255, 255, 255, ${layerAlpha})`;
                    ctx.font = `bold ${fontSize}px 'SF Mono', 'Fira Code', monospace`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.char, p.originalX, p.originalY);
                }
                
                // 主文字
                ctx.shadowBlur = glowSize;
                ctx.shadowColor = 'white';
                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity * flash})`;
                ctx.fillText(p.char, p.originalX, p.originalY);
                ctx.shadowBlur = 0;
            });
        }

        function drawDecoParticles() {
            const fontSize = 10;
            ctx.font = `${fontSize}px 'SF Mono', monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            particles.filter(p => p.type === 'decoration').forEach(p => {
                if (phase === 0) {
                    p.x += (p.targetX - p.x) * p.speed;
                    p.y += (p.targetY - p.y) * p.speed;
                    p.opacity = Math.min(p.opacity + 0.01, 0.7);
                }
                
                if (Math.random() < 0.03) {
                    p.char = getRandomChar();
                }
                
                const flash = Math.sin(time * 5 + p.angle) * 0.3 + 0.7;
                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity * flash})`;
                ctx.fillText(p.char, p.x, p.y);
            });
        }

        function drawConnections() {
            if (phase >= 2) {
                const mainChars = particles.filter(p => p.type === 'main');
                ctx.lineWidth = 1.5;
                
                for (let i = 0; i < mainChars.length; i++) {
                    for (let j = i + 1; j < mainChars.length; j++) {
                        const p1 = mainChars[i];
                        const p2 = mainChars[j];
                        const dist = Math.sqrt(
                            Math.pow(p1.originalX - p2.originalX, 2) +
                            Math.pow(p1.originalY - p2.originalY, 2)
                        );
                        
                        if (dist < 350) {
                            const alpha = (1 - dist / 350) * 0.4 * (Math.sin(time * 1.5 + i * 0.5) * 0.5 + 0.5);
                            
                            // 发光线条
                            ctx.shadowBlur = 8;
                            ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                            ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                            ctx.beginPath();
                            ctx.moveTo(p1.originalX, p1.originalY);
                            ctx.lineTo(p2.originalX, p2.originalY);
                            ctx.stroke();
                            ctx.shadowBlur = 0;
                        }
                    }
                }
            }
        }

        function drawMouseInfluence() {
            if (phase >= 2) {
                // 鼠标影响代码粒子
                codeParticles.forEach(cp => {
                    const dx = cp.x - mouseX;
                    const dy = cp.y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 150) {
                        const force = (1 - dist / 150) * 0.5;
                        cp.x += dx * force * 0.02;
                        cp.y += dy * force * 0.02;
                    }
                });
            }
        }

        function updateMouse() {
            mouseX += (targetMouseX - mouseX) * 0.1;
            mouseY += (targetMouseY - mouseY) * 0.1;
        }

        function draw() {
            time += 0.04;
            updateMouse();
            
            drawBackground();
            drawStars();
            drawFloatingParticles();
            drawCodeParticles();
            drawDecoParticles();
            drawConnections();
            drawMainChars();
            drawMouseInfluence();
            
            // 阶段管理
            if (phase === 0 && time > 6) {
                phase = 1;
                loading.classList.add('hidden');
            }
            if (phase === 1 && time > 12) {
                phase = 2;
            }
            
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        resize();
        draw();
    </script>
</body>
</html>
