name: Verify Build

# 开发期编译验证，确保分支在推送前编译通过。
# 覆盖：main 保护分支 / 活跃 feature 分支 / 手动触发。
on:
  push:
    branches: [main, feat/plugin-production]
  workflow_dispatch:

jobs:
  compile:
    name: Compile app + plugins (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 并行编译 app + 所有插件模块（利用 Gradle 增量编译）
      - name: Compile all source modules
        run: |
          ./gradlew --no-daemon \
            :app:compileDebugKotlin \
            :plugins:plugin-compose-dsl:compileDebugKotlin \
            :plugins:plugin-simple-json:compileDebugKotlin \
            :plugins:plugin-version-printer:compileDebugKotlin \
            :core:renderer-api:compileDebugKotlin

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/build/**/*.log
            app/build/**/*.txt
