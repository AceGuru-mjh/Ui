name: Verify Build

# 仅用于本地/分支开发期编译验证（不针对 main）。
# 监听 feat/stage4-previews 分支的 push，编译 app 模块以尽早发现编译错误。
on:
  push:
    branches: [ feat/stage4-previews ]
  workflow_dispatch:

jobs:
  compile:
    name: Compile app (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile debug sources
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/build/**/*.log
            app/build/**/*.txt
