name: Android CI - Build v0.0.1

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2
        
    - name: Grant execute permission for gradlew
      run: chmod +x ComposeFoundry/gradlew || echo "gradlew not found, will use gradle wrapper"
      
    - name: Build with Gradle
      working-directory: ComposeFoundry
      run: |
        ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-v0.0.1
        path: ComposeFoundry/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: ComposeFoundry/app/build/outputs/apk/debug/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
